openapi: 3.1.0
info:
  title: StoreOS technical API
  version: 1.0.0
  description: P1 platform only. No workforce modules or offline writes.
servers:
  - url: http://127.0.0.1:8080
    description: Loopback development; use HTTPS for LAN deployments.
paths:
  /api/v1/platform/context:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1context'
  /api/v1/platform/organization:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1organization'
  /api/v1/platform/organization/setup:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1organization~1setup'
  /api/v1/platform/company:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1company'
  /api/v1/platform/locations:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1locations'
  /api/v1/platform/locations/{id}:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1locations~1{id}'
  /api/v1/platform/users:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1users'
  /api/v1/platform/users/{id}:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1users~1{id}'
  /api/v1/platform/users/{id}/password:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1users~1{id}~1password'
  /api/v1/platform/audit:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1audit'
  /api/v1/platform/events:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1events'
  /api/v1/platform/events/{id}/replay:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1events~1{id}~1replay'
  /api/v1/platform/plugins:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1plugins'
  /api/v1/platform/plugins/{id}/approve:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1plugins~1{id}~1approve'
  /api/v1/platform/plugins/{id}/disable:
    $ref: './platform.openapi.json#/paths/~1api~1v1~1platform~1plugins~1{id}~1disable'
  /api/plugin/v1/organization:
    $ref: './platform.openapi.json#/paths/~1api~1plugin~1v1~1organization'
  /api/plugin/v1/events:
    $ref: './platform.openapi.json#/paths/~1api~1plugin~1v1~1events'
  /api/plugin/v1/events/{eventId}/ack:
    $ref: './platform.openapi.json#/paths/~1api~1plugin~1v1~1events~1{eventId}~1ack'
  /health:
    get:
      operationId: liveness
      summary: HTTP process is serving requests; does not promise database readiness.
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: readiness
      summary: Database and required schema are available.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database or schema unavailable; no internal diagnostics disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: An expiring, revocable session; never log this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      security:
        - session: []
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/locations/{locationId}/system/status:
    get:
      operationId: getSystemStatus
      security:
        - session: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Real database status in the authenticated account's company and location scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    Error:
      description: Safe error code and message, with no credentials or internal diagnostics.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    SessionUser:
      type: object
      required: [id, username, companyId, locationId]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        companyId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
    SessionResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: UTC instant with timezone.
        user:
          $ref: '#/components/schemas/SessionUser'
    SystemStatusResponse:
      type: object
      required: [service, apiVersion, companyId, locationId, database]
      properties:
        service:
          type: string
          const: storeos
        apiVersion:
          type: integer
          const: 1
        companyId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        database:
          type: string
          enum: [reachable]
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
